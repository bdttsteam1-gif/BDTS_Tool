efOwnEdit\" class=\"mini\" title=\"자사 참고치 직접 입력\">✎<\/button>\n            <span class=\"fi\" id=\"refOwnEditWrap\" hidden><input id=\"ref_own_lo\" class=\"num numfield\" placeholder=\"하한\"><span class=\"arrow\">–<\/span><input id=\"ref_own_hi\" class=\"num numfield\" placeholder=\"상한\"><span class=\"hint\" id=\"ref_own_u\"><\/span><button type=\"button\" id=\"refOwnDone\" class=\"mini\">완료<\/button><\/span>\n            <button type=\"button\" id=\"refOwnReset\" class=\"mini\" hidden>기본값<\/button><\/div>\n          <div class=\"fi\"><span class=\"lb\">판정 기준<\/span><div class=\"seg\" id=\"refModeSeg\"><button type=\"button\" data-mode=\"each\">각자<\/button><button type=\"button\" data-mode=\"cmp\">비교 장비<\/button><button type=\"button\" data-mode=\"own\">자사<\/button><\/div><\/div>\n        <\/div>\n      <\/div>\n      <div class=\"scroll\">\n        <table id=\"tbl\">\n          <thead>\n            <tr>\n              <th class=\"w-no\">No.<\/th>\n              <th>비교 장비<span class=\"u\" id=\"th_ref\"><\/span><\/th>\n              <th>자사 장비<span class=\"u\" id=\"th_own\"><\/span><\/th>\n              <th class=\"col-c hide-sm\">자사 변환<span class=\"u\" id=\"th_conv\"><\/span><\/th>\n              <th>Bias (%)<br><span class=\"lg-only\">자사/비교<\/span><\/th>\n              <th class=\"sep col-m hide-sm\">수동<br>보정값<\/th>\n              <th class=\"col-m sep-sm\">수동<br>Bias (%)<\/th>\n              <th class=\"sep col-r hide-sm\">추천<br>보정값<\/th>\n              <th class=\"col-r sep-sm\">추천<br>Bias (%)<\/th>\n              <th class=\"sep\">추천 계산<br>포함<\/th>\n              <th class=\"sep w-del\">삭제<\/th>\n            <\/tr>\n          <\/thead>\n          <tbody id=\"rows\"><\/tbody>\n          <tfoot>\n            <tr>\n              <td colspan=\"3\"><span class=\"lg-only\">평균 (유효 n = <b id=\"n_valid\">0<\/b>)<\/span><span class=\"sm-only\">평균 n=<b id=\"n_valid_sm\">0<\/b><\/span><\/td>\n              <td class=\"col-c hide-sm\"><\/td>\n              <td id=\"avg_bias\">—<\/td>\n              <td class=\"sep col-m hide-sm\"><\/td>\n              <td id=\"avg_manual\" class=\"col-m\">—<\/td>\n              <td class=\"sep col-r hide-sm\"><\/td>\n              <td id=\"avg_reco\" class=\"col-r\">—<\/td>\n              <td class=\"sep\"><\/td>\n              <td class=\"sep\"><\/td>\n            <\/tr>\n          <\/tfoot>\n        <\/table>\n      <\/div>\n      <div class=\"table-foot\">\n        <button type=\"button\" id=\"btnAdd\">+ 행 추가<\/button>\n        <button type=\"button\" id=\"btnClearRows\">측정값만 지우기<\/button>\n        <div class=\"legend\">\n          <span>Bias 색상:<\/span>\n          <span><i class=\"bias-low\">−10<\/i> −10% 이하<\/span>\n          <span><i class=\"bias-low2\">−20<\/i> −20% 이하<\/span>\n          <span><i class=\"bias-high\">+10<\/i> +10% 이상<\/span>\n          <span><i class=\"bias-high2\">+20<\/i> +20% 이상<\/span>\n        <\/div>\n        <div class=\"legend\" id=\"refLegend\">\n          <span>참고치:<\/span>\n          <span><span class=\"jl hi\">▲ 참고치 높음<\/span><span class=\"jl lo\">▼ 참고치 낮음<\/span> 참고치 밖 (범위 안은 표시 없음, 폰에서는 ▲▼만)<\/span>\n          <span><span class=\"jl st\">충분<\/span> 단계·주수<\/span>\n          <span><span class=\"mis-d\">불일치<\/span> 비교 장비와 자사 판정이 다른 행<\/span>\n        <\/div>\n        <p class=\"note\">「추천 계산 포함」 열: 추천 factor는 Bias가 가장 큰 행과 가장 작은 행을 하나씩 뺀 평균으로 구합니다. 기본으로 뺀 행은 「제외 (최대/최소)」로 표시됩니다. 어떤 행이든 「포함」/「제외」 버튼으로 계산에 넣거나 뺄 수 있고, 직접 뺀 행은 「제외 (수동)」으로 표시됩니다. 수동 factor 계산에는 모든 행이 들어갑니다. 행을 지우려면 맨 오른쪽 「삭제」를 누르세요.<\/p>\n        <p class=\"note\">단위 변환은 자사 장비 값에만 적용됩니다. 자사 단위는 자사 장비가 쓰는 단위 중에서 고르고, 비교 단위는 비교 장비가 보고하는 단위를 그대로 적습니다. 두 단위가 다르면 자사 값을 비교 단위로 바꾼 뒤 Bias를 계산하고, 보정값도 비교 단위로 표시합니다. 자사 값만 입력해도 변환값과 보정값은 계산되며, Bias는 비교 값이 있어야 나옵니다. 등록 아이템은 계수가 자동으로 들어가고, 계수 칸에 직접 쓰면 그 값이 우선합니다.<\/p>\n        <p class=\"note\"><kbd>Enter<\/kbd> <kbd>Tab<\/kbd> <kbd>↓<\/kbd> 아래 칸 · <kbd>Shift<\/kbd>+<kbd>Enter<\/kbd>/<kbd>Tab<\/kbd> <kbd>↑<\/kbd> 위 칸 · <kbd>←<\/kbd> <kbd>→<\/kbd> 옆 칸. 비교 장비 열 마지막 행에서 Enter를 누르면 자사 장비 열 맨 위로 갑니다.<\/p>\n      <\/div>\n    <\/div>\n\n    <aside class=\"summary\">\n      <div class=\"card reco\">\n        <h2>Spot cal 추천 factor<\/h2>\n        <div class=\"big\" id=\"f_reco\">—<\/div>\n        <div class=\"warn-box\" id=\"frWarn\" hidden><b>Spot cal 사용 수치 초과<\/b><span>추천 factor가 사용 가능 범위(0.5 – 1.5)를 벗어났습니다. 데이터나 단위를 다시 확인하세요.<\/span><\/div>\n        <dl class=\"kv\">\n          <dt>유효 데이터 수<\/dt><dd id=\"s_n\">0<\/dd>\n          <dt>제외 (최소 Bias)<\/dt><dd id=\"s_min\">—<\/dd>\n          <dt>제외 (최대 Bias)<\/dt><dd id=\"s_max\">—<\/dd>\n          <dt>평균 Bias (제외 후)<\/dt><dd id=\"s_trim\">—<\/dd>\n        <\/dl>\n        <div class=\"formula\">factor = 1 ÷ (1 + 평균 Bias %)<\/div>\n        <p class=\"note\" id=\"s_note\">비교 장비·자사 장비 값이 모두 입력된 행만 계산에 포함됩니다.<\/p>\n      <\/div>\n      <div class=\"card\">\n        <h2>보정 후 평균 Bias<\/h2>\n        <dl class=\"kv\">\n          <dt>보정 전<\/dt><dd id=\"m_raw\">—<\/dd>\n          <dt>수동 factor 적용<\/dt><dd id=\"m_manual\">—<\/dd>\n          <dt>추천 factor 적용<\/dt><dd id=\"m_reco\">—<\/dd>\n        <\/dl>\n        <p class=\"note\">Bias % = (보정값 ÷ 비교 장비 − 1) × 100. 양수는 자사 장비가 높게, 음수는 낮게 읽는다는 뜻입니다.<\/p>\n      <\/div>\n      <div class=\"card\" id=\"refCard\" hidden>\n        <h2>측정범위 · 참고치<\/h2>\n        <dl class=\"kv\">\n          <dt>측정범위 (자사)<\/dt><dd id=\"rc_wr\">—<\/dd>\n          <dt id=\"rc_wr_cmp_dt\">측정범위 (비교 단위)<\/dt><dd id=\"rc_wr_cmp\">—<\/dd>\n        <\/dl>\n        <dl class=\"kv\">\n          <dt>참고치 (비교)<\/dt><dd id=\"rc_cmp\">—<\/dd>\n          <dt id=\"rc_own_dt\">참고치 (자사)<\/dt><dd id=\"rc_own\">—<\/dd>\n        <\/dl>\n        <p class=\"note\" id=\"rc_basis\">—<\/p>\n      <\/div>\n      <div class=\"card\" id=\"convCard\" hidden>\n        <h2>단위 변환<\/h2>\n        <dl class=\"kv\">\n          <dt>아이템<\/dt><dd id=\"cv_item\">—<\/dd>\n          <dt>자사 → 비교<\/dt><dd id=\"cv_units\">—<\/dd>\n          <dt>변환 계수<\/dt><dd id=\"cv_k\">—<\/dd>\n          <dt>변환식<\/dt><dd id=\"cv_formula\">—<\/dd>\n        <\/dl>\n        <p class=\"note\" id=\"cv_note\">자사 장비 값에만 적용됩니다.<\/p>\n      <\/div>\n    <\/aside>\n  <\/section>\n<\/div>\n<div class=\"toast\" id=\"toast\"><\/div>\n\n<script>\n(function () {\n  const KEY = 'spotcal-v1';\n  const UI_KEY = 'spotcal-ui';\n  const DEFAULT_ROWS = 10;\n  const $ = (id) => document.getElementById(id);\n  const infoKeys = ['h_name','h_dev','h_sample','h_etc','p_dev','p_sn','p_lot','p_sample','q_ctrl','q_lot','q_exp','q1_mean','q1_low','q1_high','q2_mean','q2_low','q2_high'];\n  const metaKeys = infoKeys.concat(['f_manual']);\n  const numKeys = new Set(['q1_mean','q1_low','q1_high','q2_mean','q2_low','q2_high','f_manual']);\n\n  // ---------- item / unit table ----------\n  // units: [label, k, b] with  base = k * x + b  (b only used for HbA1c, whose scales are offset)\n  // units: [label, k, b] with  base = k * x + b  (b only for HbA1c, whose scales are offset)\n  // Only the units printed in the product spec sheet are listed. Coefficients follow the sheet's own ranges.\n  const ITEMS = [\n    { name: 'TSH', units: [['µIU/mL', 1], ['mIU/L', 1]], ref: { t: 'range', u: 'µIU/mL', lo: 0.4, hi: 4.0 }, wr: { u: 'µIU/mL', lo: 0.09, hi: 100 } },\n    { name: 'T3', units: [['ng/dL', 1], ['nmol/L', 1 / 0.0154], ['ng/mL', 100], ['µg/dL', 1000]], ref: { t: 'range', u: 'ng/dL', lo: 80, hi: 200 }, wr: { u: 'ng/dL', lo: 50, hi: 500 } },\n    { name: 'Free T4', units: [['ng/dL', 1], ['pmol/L', 1 / 12.87]], ref: { t: 'range', u: 'ng/dL', lo: 0.70, hi: 1.71 }, wr: { u: 'ng/dL', lo: 0.078, hi: 7.77 } },\n    { name: 'CK-MB', units: [['ng/mL', 1]], ref: { t: 'range', u: 'ng/mL', lo: null, hi: 7.00 }, wr: { u: 'ng/mL', lo: 3, hi: 100 } },\n    { name: 'Tn-I Plus', units: [['ng/mL', 1], ['pg/mL', 0.001]], ref: { t: 'range', u: 'ng/mL', lo: null, hi: 0.04, note: '99th percentile' }, wr: { u: 'ng/mL', lo: 0.01, hi: 15 } },\n    { name: 'D-Dimer', units: [['ng/mL FEU', 1], ['mg/L FEU', 1000], ['µg/mL FEU', 1000]], ref: { t: 'range', u: 'ng/mL FE
