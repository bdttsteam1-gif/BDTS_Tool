.rglob{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:12px}.rglob .card{margin:0}.rglob input[type=number]{padding:3px 6px;border:1px solid var(--line3);border-radius:4px}
.rwrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
.rlist{border:1px solid var(--line3);border-radius:4px;background:#fff;overflow:hidden;position:sticky;top:0;max-height:calc(var(--vh,700px) / var(--z,1) - 40px);overflow-y:auto}
.rlist .hd{padding:9px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);display:flex;justify-content:space-between}
.rlist .find{display:block;width:calc(100% - 20px);margin:8px 10px;padding:6px 9px;border:1px solid var(--line3);border-radius:4px;font-size:12px}
.ri{display:grid;grid-template-columns:6px 1fr auto;gap:2px 10px;padding:9px 12px 9px 0;border-top:1px solid var(--line);cursor:pointer}.ri:hover{background:#fafaf6}
.ri .bar{grid-row:1/4;border-radius:0 3px 3px 0}.ri b{font-size:13px;word-break:break-all}.ri .n{font-size:11px;color:var(--mute)}
.ri .st{grid-column:3;grid-row:1;font-size:11px;font-weight:700;white-space:nowrap}.st.ok{color:#4b8a33}.st.chg{color:#cd8407}.st.none{color:var(--fg4)}
.ri .md{grid-column:2/4;font-size:11.5px;color:var(--fg2)}
.rstrip{grid-column:2/4;display:flex;height:7px;border-radius:2px;overflow:hidden;background:var(--soft)}
.ri.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.rdetail{padding:0;margin:0;overflow:visible}
.rdetail .dh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rdetail .dh h3{margin:0;font-size:16px}.rdetail .dh .srcl{color:var(--mute);font-size:12px}.rdetail .dh .nav{margin-left:auto;display:flex;gap:6px}
.rdetail .sec{padding:12px 16px;border-bottom:1px solid var(--line)}
.rdetail .sec h5{margin:0 0 8px;font-size:12px;color:var(--mute);letter-spacing:.04em}.rdetail .sec h5 small{font-weight:400;margin-left:6px}
.ctlinfo{display:flex;gap:10px;align-items:center;font-size:12.5px;background:var(--soft);border-radius:4px;padding:7px 10px;flex-wrap:wrap}
.cdot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}.cdot.big{width:14px;height:14px}
table.edit input:focus,table.edit select:focus{outline:2px solid var(--accent);outline-offset:1px;background:#fff}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--fg2);margin-top:10px}
.keys kbd{display:inline-block;min-width:22px;padding:1px 6px;border:1px solid var(--line3);border-bottom-width:2px;border-radius:4px;background:#fff;font-family:var(--font);font-size:11.5px;text-align:center;margin-right:3px}
.actbar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:#fcfcfa;flex-wrap:wrap;border-radius:0 0 4px 4px}
.actbar .msg{margin-left:auto;font-size:12px;color:#cd8407;font-weight:700}
.copyto{position:relative}.copyto summary{list-style:none}.copyto summary::-webkit-details-marker{display:none}
.copyto .menu{position:absolute;bottom:calc(100% + 6px);left:0;z-index:20;background:#fff;border:1px solid var(--line3);border-radius:6px;box-shadow:rgba(0,0,0,.2) 0 12px 30px -8px;padding:8px 10px;min-width:280px;max-height:320px;overflow:auto}
.copyto .menu .btn{margin-top:6px}
.colstrip{display:flex;flex-wrap:wrap;gap:2px;margin:6px 0 4px}.colstrip i{height:22px;border-radius:2px;display:block;cursor:pointer}
.colstrip i.x{background:repeating-linear-gradient(45deg,#e5e7e0,#e5e7e0 3px,#fff 3px,#fff 6px);outline:1px dashed #c9cbc2;outline-offset:-1px}
.colaxis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--fg4)}
.chk{font-weight:700}.chk.ok{color:#4b8a33}.chk.w{color:#cd8407}
.callo{border-radius:4px;padding:9px 12px;font-size:12.5px;margin:8px 0;background:var(--soft);border:1px solid var(--line)}.callo ul{margin:4px 0 0;padding-left:18px}
.callo.w{background:var(--yel);border-color:#ecd2a0}.callo.ok{background:var(--grn);border-color:#c5dcb8}
.rlists details{margin-top:8px}.rlists summary{cursor:pointer;padding:4px 0}.tscroll.mini{max-height:260px;margin-top:4px}
.editwrap{overflow-x:auto}
.rglob .okbox{display:block;padding:6px 10px;text-align:left;font-size:12.5px}
.rdetail .radio label{min-width:0}

/* 팝업: 글자 크기 배율을 반영해 항상 화면 안 · 넘쳐도 바깥을 스크롤해서 닫기 버튼에 닿을 수 있게 */
.modal{overflow:auto;padding:12px;align-items:flex-start;cursor:pointer}
.modal .box{margin:auto;max-height:calc((100vh - 24px) / var(--z,1));width:min(1100px,calc((100vw - 24px) / var(--z,1)));overflow:hidden;cursor:default}
.modal .box[style*="max-width"]{width:min(600px,calc((100vw - 24px) / var(--z,1)))}
.modal .hd{flex:none}.modal .hd>b{white-space:nowrap}
.modal{z-index:70}
.modal .box>div:not(.hd):not(.ft){flex:1 1 auto;overflow:auto;min-height:0}
.copyto.down .menu{bottom:auto;top:calc(100% + 6px)}

.modal .ft{flex:none;padding:10px 18px;border-top:1px solid var(--line);text-align:right;background:#fcfcfa;border-radius:0 0 6px 6px}

/* ===== 모바일 (화면 폭 820px 이하): 왼쪽 목록은 ☰ 메뉴로 · 카드·표는 한 줄로 쌓기 · 넓은 표는 표 안에서 옆으로 ===== */
#menuBtn{display:none}
.navback{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;z-index:80;width:min(280px,86vw);background:var(--bg);transform:translateX(-105%);transition:transform .18s;box-shadow:rgba(0,0,0,.25) 0 10px 40px}
  .app.navopen .rail{transform:none}
  .app.navopen .navback{display:block;position:fixed;inset:0;z-index:79;background:rgba(35,37,29,.35)}
  #menuBtn{display:inline-block}
  #top{padding:8px 10px;gap:6px}
  #top .crumb{flex:1}
  #filter{order:5;width:100%}
  #filter .sel select{max-width:110px}
  #top .right{order:4;width:100%;justify-content:flex-start;margin-left:0}
  .zoom{display:none}
  .deskwrap{padding:6px}
  .window{border-radius:4px}
  .titlebar .dots{display:none}.titlebar{grid-template-columns:20px 1fr 0}
  .statusstrip{padding:6px 10px}
  #viewInner{padding:10px 10px 30px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .card{overflow-x:auto}
  .card:has(table.stat),.card:has(table.pivot),.card:has(table.wide){width:auto}
  .clswrap{flex-direction:column}.clswrap .side{position:static;flex:none;width:100%}
  .chartbox{flex:1 1 100%;min-width:0}
  .rwrap{grid-template-columns:minmax(0,1fr)}
  .rlist{position:static;max-height:260px}
  .rglob{grid-template-columns:minmax(0,1fr)}
  .rsub{width:100%}.rsub span{flex:1;padding:8px 6px;text-align:center;font-size:12px}
  .radio{flex-direction:column}
  .rdetail .dh .nav{margin-left:0}
  .keys{display:none}
  .actbar .msg{margin-left:0}
  .modal{padding:0}
  .modal .box{max-height:100vh;width:100vw;border-radius:0}
  .modal .box[style*="max-width"]{width:100vw}
  .opts{gap:10px}
  #toTop{right:12px;bottom:14px}
}
</style>
</head>

/* ===== 브라우저 저장소 (IndexedDB) — 새로고침(F5)해도 작업 유지 ===== */
const ST = (() => {
  // 저장 공간은 HTML 파일 위치별로 따로 (이름·위치를 바꾼 파일이 다른 파일의 이전 작업을 불러오지 않도록)
  let where = ''; try { where = decodeURIComponent(location.pathname || ''); } catch (e) { where = location.pathname || ''; }
  const DB = 'rawdata_tool|' + where, STORE = 'kv';
  let dbp = null;
  function open() {
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      try { const r = indexedDB.open(DB, 1); r.onupgradeneeded = () => r.result.createObjectStore(STORE); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
    return dbp;
  }
  async function tx(mode, fn) { const db = await open(); return new Promise((res, rej) => { const t = db.transaction(STORE, mode); const st = t.objectStore(STORE); const req = fn(st); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); }
  const put = (k, v) => tx('readwrite', st => st.put(v, k)).catch(e => { console.warn('저장 실패', e); return null; });
  const get = k => tx('readonly', st => st.get(k)).catch(() => null);
  const del = k => tx('readwrite', st => st.delete(k)).catch(() => null);
  return { put, get, del };
})();

        if (filled >= Math.max(2, tests.length * 0.5)) topRows[r] = { label: row[1] != null ? String(row[1]) : '', vals: vals.map(v => v == null ? '' : String(v)), filled };
      }
    }
    return { tests, topRows, rawStartMin };
  }
  return { extractSheet, isNum, toNum, resNum, classifyError, str, normDate };
})();

    if (!tests.length) { UI.flash(fails.length ? `파일을 읽지 못했습니다 — ${fails.join(' / ')}` : 'raw data 열을 찾지 못했습니다 (#Filtered Scan Data# / #### AFIAS / ## Up bar data 로 시작하는 열과 #### SCAN DATA 구간이 필요)', 12000); return false; }
    if (fails.length) setTimeout(() => UI.flash(`일부 파일을 읽지 못했습니다 — ${fails.join(' / ')}`, 12000), 2400);
    S.files = names; S.tests = tests; S.srcTop = srcTop;
    if (restore) {
      Object.assign(S.opts, restore.opts || {}); S.rules = restore.rules || {}; S.nameRows = restore.nameRows || {};
      const u = restore.ui || {}; S.ui.tab = u.tab || 'home'; S.ui.filter = Object.assign(DEF_FILTER(), u.filter || {}); S.ui.cats = u.cats ? new Set(u.cats) : null; S.ui.page = u.page || 0; S.ui.showAllLines = !!u.showAllLines; S.ui.catOpen = u.catOpen || []; S.ui.rsub = u.rsub || 'sheets'; S.ui.rsheet = u.rsheet || null; S.ui.rres = u.rres || null;
    } else {
      S.rules = {}; S.nameRows = {}; S.ui.filter = DEF_FILTER(); S.ui.cats = null; S.ui.page = 0; S.ui.tab = 'home';
      ST.put('files', saved);
    }
    MD.buildSheets();
    // 복원한 필터가 지금 데이터에 없으면 해제
    const has = (k, fn) => !S.ui.filter[k] || S.tests.some(t => fn(t) === S.ui.filter[k]);
    if (!has('product', t => t.product) || !has('lot', t => t.lot) || !has('device', t => t.device)) S.ui.filter = DEF_FILTER();
    UI.render();
    const n = tests.length, c = tests.filter(t => t.control).length;
    UI.flash(restore ? `이전 작업을 복원했습니다 · 파일 ${names.length}개 · 테스트 ${n}건` : `테스트 ${n}건 · 장비 시트 ${S.sheets.length}개${c ? ` · control 정보 ${c}건 자동 감지` : ' · control 정보 없음 → 필요하면 실험 규칙에서 조건 지정'}`);
    return true;
  }
  // 상태 저장 (렌더 후 0.4초 모아서)
  let saveT = null;
  window.__saveState = () => {
    if (!S.tests.length) return; clearTimeout(saveT);
    saveT = setTimeout(() => {
      const state = { opts: S.opts, rules: S.rules, nameRows: S.nameRows, ui: { tab: S.ui.tab, filter: S.ui.filter, cats: S.ui.cats ? [...S.ui.cats] : null, page: S.ui.page || 0, showAllLines: !!S.ui.showAllLines, catOpen: S.ui.catOpen || [], rsub: S.ui.rsub, rsheet: S.ui.rsheet, rres: S.ui.rres } };
      try { ST.put('state', JSON.parse(JSON.stringify(state))); } catch (e) { console.warn(e); }
    }, 400);
  };
  window.__resetAll = async () => {
    clearTimeout(saveT); await ST.del('files'); await ST.del('state');
    S.files = []; S.tests = []; S.sheets = []; S.srcTop = {}; S.rules = {}; S.nameRows = {};
    S.ui.filter = DEF_FILTER(); S.ui.cats = null; S.ui.page = 0; S.ui.tab = 'home'; S.ui.showAllLines = false;
    document.querySelectorAll('.modal').forEach(m => m.remove());
    UI.render(); UI.flash('초기화했습니다');
  };
  window.addEventListener('DOMContentLoaded', async () => {
    UI.init(); UI.render();
    const inp = document.getElementById('file'); inp.addEventListener('change', () => { loadFiles(inp.files); inp.value = ''; });
    // 화면 어디에 놓아도 업로드
    const ov = document.getElementById('dropOverlay'); let depth = 0;
    const isFile = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
    window.addEventListener('dragenter', e => { if (!isFile(e)) return; e.preventDefault(); depth++; ov.classList.add('on'); });
    window.addEventListener('dragover', e => { if (!isFile(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; ov.classList.add('on'); });
    window.addEventListener('dragleave', e => { if (!isFile(e)) return; depth = Math.max(0, depth - 1); if (!depth || !e.relatedTarget) ov.classList.remove('on'); });
    window.addEventListener('drop', e => { if (!isFile(e)) return; e.preventDefault(); depth = 0; ov.classList.remove('on'); const dt = e.dataTransfer; let fl = [...(dt.files || [])]; if (!fl.length && dt.items) fl = [...dt.items].filter(i => i.kind === 'file').map(i => i.getAsFile()).filter(Boolean); loadFiles(fl); });
    // 이전 작업 복원
    try {
      const files = await ST.get('files');
      if (files && files.length) { const state = await ST.get('state'); await loadFiles(files, state || {}); }
    } catch (e) { console.warn('복원 실패', e); }
  });
  window.__loadFiles = loadFiles; // 검증용
})();

</script>
</body>
</html>
