<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#e1d7c2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TS 도구">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>TS팀 도구</title>
<style>
:root{
  --bg:#e1d7c2; --paper:#fff; --paper2:#eeefe9; --line:#bfc1b7; --line2:#e5e7e0;
  --fg:#23251d; --fg2:#4d4f46; --fg3:#65675e; --amber:#eb9d2a; --amber-dk:#cd8407;
  --ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid #2f80fa;outline-offset:2px}

/* 메뉴 화면 */
#menu{min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 28px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:560px;display:flex;flex-direction:column;gap:18px}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--fg2);font-size:13.5px}
.list{display:flex;flex-direction:column;gap:10px}
.tool{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:6px}
.tool:hover{background:var(--paper2)}
.tool:active{transform:translateY(1px)}
.tool img{width:44px;height:44px;border-radius:8px;flex:0 0 44px}
.tool b{display:block;font-size:16px;font-weight:700}
.tool small{display:block;color:var(--fg3);font-size:12.5px}
.tool .go{margin-left:auto;color:var(--fg3);font-size:20px}
.foot{font-size:12px;color:var(--fg3);display:flex;flex-direction:column;gap:4px}
.foot .st{display:inline-flex;align-items:center;gap:6px}
.foot .dot{width:8px;height:8px;border-radius:50%;background:#9ea096}
.foot .dot.on{background:#4b8a33}

/* 도구 화면 */
#viewer{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
#viewer[hidden]{display:none}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 6px) 10px 6px;background:var(--bg);border-bottom:1px solid var(--line)}
.back{display:inline-flex;align-items:center;gap:4px;padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper);font-size:14px;font-weight:600}
.back:hover{background:var(--paper2)}
.bar .t{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frame{flex:1 1 auto;width:100%;border:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<main id="menu">
  <div class="wrap">
    <header>
      <h1>TS팀 도구</h1>
      <p>기술영업팀 업무용 계산기 · 도구 모음</p>
    </header>
    <div class="list" id="list"></div>
    <div class="foot">
      <span class="st"><i class="dot" id="netdot"></i><span id="nettxt">연결 상태 확인 중</span></span>
      <span id="swtxt"></span>
    </div>
  </div>
</main>

<section id="viewer" hidden>
  <div class="bar">
    <button class="back" id="back" type="button" aria-label="메뉴로 돌아가기">‹ 메뉴</button>
    <span class="t" id="vtitle"></span>
  </div>
  <iframe id="frame" title="도구 화면"></iframe>
</section>

<script>
/* 도구 목록: 새 도구를 넣을 때는 tools 폴더에 html을 넣고 여기 한 줄 추가 + sw.js의 FILES에도 추가 */
const TOOLS = [
  { id:'csc-calc', name:'CSC 계산기', desc:'Spot Calibration · Control', file:'tools/csc-calc.html', icon:'icons/icon-192.png' }
];

const $ = s => document.querySelector(s);
$('#list').innerHTML = TOOLS.map(t =>
  `<button class="tool" type="button" data-id="${t.id}"><img src="${t.icon}" alt=""><span><b>${t.name}</b><small>${t.desc}</small></span><span class="go" aria-hidden="true">›</span></button>`
).join('');

function show(){
  const id = location.hash.slice(1).split('/')[0];
  const t = TOOLS.find(x => x.id === id);
  if(t){
    $('#vtitle').textContent = t.name;
    const fr = $('#frame');
    if(fr.dataset.id !== t.id){ fr.src = t.file; fr.dataset.id = t.id; }
    $('#viewer').hidden = false; $('#menu').hidden = true;
    document.title = t.name;
  } else {
    $('#viewer').hidden = true; $('#menu').hidden = false;
    document.title = 'TS팀 도구';
  }
}
$('#list').addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if(!b) return;
  fromMenu = true; location.hash = b.dataset.id;
});
let fromMenu = false;
$('#back').addEventListener('click', () => {
  /* 메뉴에서 들어왔으면 뒤로 가기(안드로이드 뒤로 버튼과 같은 동작), 주소로 바로 들어왔으면 메뉴로 */
  if(fromMenu){ fromMenu = false; history.back(); }
  else { history.replaceState(null, '', location.pathname); show(); }
});
window.addEventListener('hashchange', show);
show();

function net(){ const on = navigator.onLine; $('#netdot').classList.toggle('on', on); $('#nettxt').textContent = on ? '온라인' : '오프라인 (저장된 화면으로 동작)'; }
addEventListener('online', net); addEventListener('offline', net); net();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg => {
    $('#swtxt').textContent = '오프라인 사용 준비됨';
  }).catch(() => { $('#swtxt').textContent = '오프라인 저장을 켜지 못함 (https 주소에서만 동작)'; });
}
</script>
</body>
</html>
