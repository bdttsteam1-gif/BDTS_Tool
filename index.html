<style>
:root { --bg:#efeae0; --surface:#fff; --line:#d9d2c3; --line-strong:#bfb8a8; --fg:#2a2824; --muted:#5e594f; --accent:#c4501f; --bad:#c62828; --font:"IBM Plex Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans CJK KR",sans-serif; --navh:56px; --botn:60px; }
* { box-sizing:border-box; }
html,body { height:100%; margin:0; }
body { background:var(--bg); color:var(--fg); font-family:var(--font); font-size:14px; overflow:hidden; display:flex; flex-direction:column; }
button { font:inherit; color:inherit; cursor:pointer; }
#bar { flex:none; height:var(--navh); display:flex; align-items:stretch; gap:6px; padding:0 20px 0 24px; background:var(--surface); border-bottom:1px solid var(--line); z-index:5; }
#brand { display:flex; align-items:center; gap:9px; font-size:17px; font-weight:700; margin-right:18px; white-space:nowrap; }
#brand { user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
#brand svg { width:24px; height:24px; }
#tabs { display:flex; align-items:stretch; gap:2px; min-width:0; }
.nt { border:0; background:none; padding:0 18px; display:flex; align-items:center; gap:6px; font-size:15px; color:#4a463d; border-bottom:3px solid transparent; white-space:nowrap; }
.nt:hover { background:#f6f2e9; }
.nt.on { color:var(--fg); font-weight:700; border-bottom-color:var(--accent); }
.pcb { font-size:10px; font-weight:700; color:var(--muted); background:#e8e1d2; border-radius:3px; padding:1px 5px; }
#right { margin-left:auto; display:flex; align-items:center; gap:14px; }
#rev { font-size:12px; color:var(--muted); font-family:"Source Code Pro",ui-monospace,Menlo,Consolas,monospace; white-space:nowrap; }
#resetAll { height:34px; padding:0 14px; border:1px solid var(--line-strong); background:#fff; border-radius:4px; font-size:13px; font-weight:600; color:var(--bad); white-space:nowrap; }
#resetAll:hover { background:#fdeceb; border-color:var(--bad); }
#stage { flex:1; min-height:0; position:relative; }
#stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg); display:none; }
#stage iframe.on { display:block; }
#loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; pointer-events:none; }
#bnav { display:none; }
.ov { position:fixed; inset:0; z-index:50; background:rgba(35,33,28,.5); display:flex; align-items:center; justify-content:center; padding:16px; }
.ov[hidden] { display:none; }
.dlg { background:#fff; border:1px solid var(--line-strong); border-radius:6px; width:min(430px,100%); padding:20px 22px; display:grid; gap:10px; box-shadow:0 16px 40px rgba(0,0,0,.25); }
.dlg b.t { font-size:17px; }
.dlg p { margin:0; font-size:13.5px; line-height:1.6; white-space:pre-line; }
.dlg .act { display:flex; justify-content:flex-end; gap:8px; margin-top:6px; }
.dlg .act button { height:36px; padding:0 16px; border:1px solid var(--line-strong); background:#f4f0e6; border-radius:4px; font-size:13.5px; }
.dlg .act button.ok { background:var(--bad); border-color:var(--bad); color:#fff; font-weight:600; }
.dlg input[type=password] { height:40px; padding:0 12px; border:1px solid var(--line-strong); border-radius:4px; font:inherit; font-size:15px; width:100%; }
.dlg input[type=password]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
.dlg .act button.go { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.dlg .act button:disabled { opacity:.6; cursor:default; }
.dlg p.err { color:var(--bad); min-height:1.6em; }
#toast { position:fixed; left:50%; bottom:76px; transform:translateX(-50%); background:#2a2824; color:#fff; font-size:13px; padding:8px 14px; border-radius:6px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:60; }
#toast.show { opacity:1; }
@media (max-width:820px) {
  :root { --navh:48px; }
  #bar { padding:0 12px; gap:8px; }
  #brand { margin-right:0; font-size:15px; }
  #brand span.long { display:none; }
  #tabs { display:none; }
  #mtitle { display:block; font-size:15px; font-weight:700; align-self:center; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  #rev { font-size:11px; }
  #resetAll { height:32px; padding:0 10px; font-size:12.5px; }
  #right { gap:8px; }
  #bnav { display:flex; flex:none; height:var(--botn); background:#fff; border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0); }
  .bi { flex:1; border:0; background:none; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:12.5px; color:var(--muted); border-top:3px solid transparent; }
  .bi.on { color:var(--fg); font-weight:700; border-top-color:var(--accent); }
  #toast { bottom:calc(var(--botn) + 16px); }
}
@media (min-width:821px) { #mtitle { display:none; } }
</style>

    Object.keys(frames).forEach(function (k) { frames[k].classList.toggle('on', k === id); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-tool]'), function (b) { var on = b.getAttribute('data-tool') === id; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    $('rev').textContent = t.rev; $('mtitle').textContent = t.short; document.title = t.name + ' · TS팀 도구';
    if (remember && !t.hidden) { try { localStorage.setItem(LAST_KEY, id); } catch (e) {} }
    try { f.focus(); } catch (e) {}
  }
  // 탭 만들기 (PC 위쪽 · 모바일 아래쪽)
  function addTab(t) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'nt'; b.setAttribute('data-tool', t.id); b.setAttribute('role', 'tab');
    b.innerHTML = '<span>' + t.name + '</span>'; $('tabs').appendChild(b);
    var m = document.createElement('button'); m.type = 'button'; m.className = 'bi'; m.setAttribute('data-tool', t.id); m.setAttribute('role', 'tab');
    m.innerHTML = '<span>' + t.short + '</span>' + (t.pc ? '<span class="pcb">PC 권장</span>' : ''); $('bnav').appendChild(m);
  }
  TOOLS.forEach(addTab);
  document.addEventListener('click', function (e) { var b = e.target.closest && e.target.closest('[data-tool]'); if (b) show(b.getAttribute('data-tool'), true); });

  // 처음 열면 Raw Data, 그다음부터는 마지막에 열어 둔 탭
  var first = 'raw';
  try { var s = localStorage.getItem(LAST_KEY); if (s && find(s)) first = s; } catch (e) {}
  show(first, false);

  // ---- 전체 리셋: 지금 보는 탭의 정보만 지움 ----
  var toastT;
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('show'); }, 2200); }
  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  async function doReset(id) {
    var f = frames[id], w = f && f.contentWindow, d = f && f.contentDocument;
    if (!w) return false;
    if (id === 'spot') { w.TSReset(); }
    else if (id === 'raw') { await w.__resetAll(); }
    else if (id === 'ctrl') {
      var btn = d.querySelector('[data-ctlclear]');
      if (btn) btn.click();
      else { try { w.localStorage.removeItem('csc:ctl-calc'); } catch (e) {} f.srcdoc = srcHtml(id); }
    }
    else if (id === 'guide') { var b = d.getElementById('resetBtn'); b.click(); await wait(30); b.click(); }
    else if (id === 'plan') { f.srcdoc = srcHtml(id); }
    return true;
  }
  $('resetAll').addEventListener('click', function () {
    var t = find(cur);
    $('cfT').textContent = t.name + ' 전체 리셋';
    $('cfM').textContent = '이 탭의 정보만 지웁니다: ' + t.what + '.\n다른 탭의 정보는 그대로 남습니다. 되돌릴 수 없습니다.';
    $('cfOv').hidden = false; $('cfNo').focus();
  });
  function closeCf() { $('cfOv').hidden = true; }
  $('cfNo').addEventListener('click', closeCf);
  $('cfOv').addEventListener('click', function (e) { if (e.target === $('cfOv')) closeCf(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCf(); });
  $('cfYes').addEventListener('click', async function () {
    var id = cur, t = find(id); closeCf();
    try { var ok = await doReset(id); toast(ok ? t.name + ' 전체 리셋했습니다' : '이 탭이 아직 열리지 않았습니다'); }
    catch (e) { console.error(e); toast('리셋하지 못했습니다'); }
  });
  // ---- 암호화 파일로 분리한 도구 열기: 로고를 3초 안에 5번 누르면 비밀번호 창 ----
  var KDF_ITER = 600000, keyCache = {}, taps = [];
  function hex(u) { var r = ''; for (var i = 0; i < u.length; i++) r += (u[i] < 16 ? '0' : '') + u[i].toString(16); return r; }
  async function keyFor(pass, salt) {
    var h = hex(salt); if (keyCache[h]) return keyCache[h];
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    return (keyCache[h] = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: salt, iterations: KDF_ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']));
  }
  async function openVault(buf, id, pass) {
    var u = new Uint8Array(buf);
    if (u.length < 48 || u[0] !== 0x54 || u[1] !== 0x53 || u[2] !== 0x56 || u[3] !== 0x31) throw new Error('format');
    var key = await keyFor(pass, u.slice(4, 20));
    var pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u.slice(20, 32), additionalData: new TextEncoder().encode(id) }, key, u.slice(32));
    return new TextDecoder('utf-8').decode(pt);
  }
  async function unlock(pass) {
    var added = [], badpw = false, missing = false;
    keyCache = {};  /* 시도마다 비움: 오답으로 만든 키가 남지 않게 */
    for (var i = 0; i < HIDDEN.length; i++) {
      var t = HIDDEN[i]; if (find(t.id)) continue;
      var buf;
      try { var r = await fetch(t.file); if (!r.ok) throw new Error('http'); buf = await r.arrayBuffer(); } catch (e) { missing = true; continue; }
      try { vault[t.id] = await openVault(buf, t.id, pass); } catch (e) { if (e && e.message === 'format') missing = true; else badpw = true; continue; }
      TOOLS.push(t); addTab(t); added.push(t.id);
    }
    return { added: added, badpw: badpw, missing: missing };
  }
  var pwBusy = false;
  function openPw() {
    if (!(window.crypto && crypto.subtle)) { toast('이 주소에서는 사용할 수 없습니다'); return; }
    if (HIDDEN.every(function (t) { return find(t.id); })) { toast('이미 열려 있습니다'); return; }
    $('pwMsg').textContent = ''; $('pwIn').value = ''; $('pwOv').hidden = false; $('pwIn').focus();
  }
  function closePw() { if (pwBusy) return; $('pwOv').hidden = true; $('pwIn').value = ''; }
  $('brand').addEventListener('click', function () {
    var n = Date.now(); taps.push(n); taps = taps.filter(function (x) { return n - x < 3000; });
    if (taps.length >= 5) { taps = []; openPw(); }
  });
  $('pwNo').addEventListener('click', closePw);
  $('pwOv').addEventListener('click', function (e) { if (e.target === $('pwOv')) closePw(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePw(); });
  $('pwForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    var pass = $('pwIn').value; if (!pass || pwBusy) return;
    pwBusy = true; $('pwGo').disabled = true; $('pwNo').disabled = true; $('pwMsg').textContent = '확인하는 중…';
    var res;
    try { res = await unlock(pass); } catch (err) { console.error(err); res = { added: [], badpw: false, missing: true }; }
    pwBusy = false; $('pwGo').disabled = false; $('pwNo').disabled = false;
    if (res.added.length) { $('pwOv').hidden = true; $('pwIn').value = ''; show(res.added[0], false); toast('열었습니다'); }
    else if (res.badpw) { $('pwMsg').textContent = '비밀번호가 맞지 않습니다'; $('pwIn').select(); }
    else { $('pwMsg').textContent = '파일을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; }
  });
})();
</script>
<script>if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}</script>
